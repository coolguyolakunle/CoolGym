{% extends "base.html" %}
{% block title %}Join CoolGym{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-24">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="{{ url_for('main.index') }}" class="font-display text-4xl brand-text">COOLGYM</a>
      <h1 class="font-display text-3xl text-white mt-4">CREATE ACCOUNT</h1>
      <p class="text-gray-400 text-sm mt-1">Start your fitness journey today</p>
    </div>

    <div class="bg-dark-700 border border-gray-800 rounded-3xl p-8">
        <form method="POST" action="{{ url_for('auth.register') }}" class="flex flex-col gap-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">First Name</label>
                    <input type="text" name="first_name" required
                    class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
                    placeholder="John">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Last Name</label>
                    <input type="text" name="last_name" required
                    class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
                    placeholder="Doe">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Password</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
                    placeholder="Min. 6 characters">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Confirm Password</label>
                <input type="password" name="confirm_password" required
                    class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
                    placeholder="Repeat password">
            </div>
            <button type="submit" class="brand-bg text-black font-bold py-3.5 rounded-xl text-sm hover:opacity-90 transition-opacity mt-1">
                Create Account →
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="brand-text font-semibold hover:underline">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
