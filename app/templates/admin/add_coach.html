{% extends "admin/base.html" %}
{% block title %}Add Coach — Admin{% endblock %}
{% block page_title %}Add Coach{% endblock %}
{% block content %}
<div class="max-w-xl">
  <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
    <a href="{{ url_for('admin.admin_coaches') }}" class="hover:text-brand transition-colors">Coaches</a>
    <span>›</span><span class="text-white">Add New</span>
  </div>

  <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6">
    <h3 class="font-semibold text-white mb-5">New Coach Details</h3>
    <form method="POST" class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">First Name</label>
          <input type="text" name="first_name" required placeholder="John"
            class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">Last Name</label>
          <input type="text" name="last_name" required placeholder="Doe"
            class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">Email</label>
        <input type="email" name="email" required placeholder="coach@flexova.com"
          class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">Password</label>
        <input type="password" name="password" required minlength="6" placeholder="Min. 6 characters"
          class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">Specialty</label>
        <input type="text" name="specialty" placeholder="e.g. Strength & Conditioning, HIIT, Yoga"
          class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-widest">Bio</label>
        <textarea name="bio" rows="3" placeholder="Short bio about the coach..."
          class="w-full bg-dark-700 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors resize-none"></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="brand-bg text-brand font-bold px-6 py-2.5 rounded-xl text-sm hover:opacity-90 transition-opacity ripple-btn">Create Coach</button>
        <a href="{{ url_for('admin.admin_coaches') }}" class="border border-gray-700 text-gray-300 font-semibold px-6 py-2.5 rounded-xl text-sm hover:border-gray-500 transition-colors">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
