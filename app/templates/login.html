{% extends "base.html" %}
{% block title %}Login — CoolGym{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-24">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="{{ url_for('main.index') }}" class="font-display text-4xl brand-text">COOLGYM</a>
      <h1 class="font-display text-3xl text-white mt-4">WELCOME BACK</h1>
      <p class="text-gray-400 text-sm mt-1">Sign in to your account</p>
    </div>

    <div class="bg-dark-700 border border-gray-800 rounded-3xl p-8">
      <form method="POST" action="{{ url_for('auth.login') }}" class="flex flex-col gap-5">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Email Address</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
            placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Password</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full bg-dark-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-brand transition-colors"
            placeholder="••••••••">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
            <input type="checkbox" name="remember" class="accent-brand rounded">
            Remember me
          </label>
        </div>
        <button type="submit" class="brand-bg text-black font-bold py-3.5 rounded-xl text-sm hover:opacity-90 transition-opacity mt-1">
          Login →
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="brand-text font-semibold hover:underline">Join CoolGym</a>
    </p>
  </div>
</div>
{% endblock %}
